name: Scheduled Sync Interpelli

on:
  schedule:
    # Esegue ogni 30 minuti dalle 07:00 alle 21:00 UTC (lun-dom)
    - cron: '*/30 7-21 * * *'
  workflow_dispatch: # Permette anche l'esecuzione manuale da GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync API
        run: |
          curl -X POST "${{ secrets.VERCEL_APP_URL }}/api/sync"
