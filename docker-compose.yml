services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interpelli-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - SYNC_INTERVAL_MINUTES=30
      - SYNC_START_HOUR=7
      - SYNC_END_HOUR=21
      - AUTO_SYNC_ON_STARTUP=true
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
    container_name: interpelli-frontend
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend
